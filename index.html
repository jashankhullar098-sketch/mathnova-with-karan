<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MathNova with Karan</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f6fb;
    color:#222;
}

.header{
    background:#1769e0;
    color:white;
    text-align:center;
    padding:22px 10px;
}

.header h1{
    margin:0;
    font-size:28px;
}

.header p{
    margin:6px 0 0;
}

.container{
    max-width:750px;
    margin:30px auto;
    padding:20px;
}

.card{
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 3px 12px rgba(0,0,0,.12);
}

h2{
    margin-top:0;
}

button{
    width:100%;
    padding:15px;
    margin:7px 0;
    border:0;
    border-radius:10px;
    background:#1769e0;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#0d52b8;
}

.back{
    background:#555;
}

.chapter{
    text-align:left;
    background:#1769e0;
}

.hidden{
    display:none;
}

.footer{
    text-align:center;
    margin-top:30px;
    color:#777;
}
</style>
</head>

<body>

<div class="header">
    <h1>📐 MathNova with Karan</h1>
    <p>Mathematics for CBSE & PSEB | Class 11 & 12</p>
</div>

<div class="container">

    <!-- CLASS PAGE -->
    <div id="classPage" class="card">
        <h2>🎓 Select Your Class</h2>

        <button onclick="showBoard(11)">Class 11</button>
        <button onclick="showBoard(12)">Class 12</button>
    </div>


    <!-- BOARD PAGE -->
    <div id="boardPage" class="card hidden">
        <h2 id="boardTitle"></h2>

        <p>Select your board</p>

        <button onclick="openSubjects('CBSE')">
            📘 CBSE
        </button>

        <button onclick="openSubjects('PSEB')">
            📗 PSEB
        </button>

        <button class="back" onclick="goBack('classPage')">
            ← Back
        </button>
    </div>


    <!-- MAIN SUBJECT PAGE -->
    <div id="subjectPage" class="card hidden">
        <h2 id="subjectTitle"></h2>

        <button onclick="openChapters()">
            📚 Chapters
        </button>

        <button>
            🎥 Video Classes
        </button>

        <button>
            🔴 Live Class
        </button>

        <button>
            📄 Notes
        </button>

        <button>
            📝 Practice Test
        </button>

        <button>
            ⭐ Important Questions
        </button>

        <button>
            🔖 Bookmarks
        </button>

        <button class="back" onclick="goBack('boardPage')">
            ← Back
        </button>
    </div>


    <!-- CHAPTER PAGE -->
    <div id="chapterPage" class="card hidden">
        <h2 id="chapterTitle">📚 Class 11 Chapters</h2>

        <div id="chapterList"></div>

        <button class="back" onclick="goBack('subjectPage')">
            ← Back
        </button>
    </div>

</div>

<div class="footer">
    © 2026 MathNova with Karan
</div>


<script>

let selectedClass = "";
let selectedBoard = "";


function hideAll(){
    document.getElementById("classPage").classList.add("hidden");
    document.getElementById("boardPage").classList.add("hidden");
    document.getElementById("subjectPage").classList.add("hidden");
    document.getElementById("chapterPage").classList.add("hidden");
}


function showBoard(classNumber){

    selectedClass = classNumber;

    hideAll();

    document.getElementById("boardTitle").innerText =
        "Class " + classNumber;

    document.getElementById("boardPage").classList.remove("hidden");
}


function openSubjects(board){

    selectedBoard = board;

    hideAll();

    document.getElementById("subjectTitle").innerText =
        "Class " + selectedClass + " • " + board + " Mathematics";

    document.getElementById("subjectPage").classList.remove("hidden");
}


function openChapters(){

    hideAll();

    let list = document.getElementById("chapterList");

    list.innerHTML = "";

    let chapters11 = [
        "1. Sets",
        "2. Relations and Functions",
        "3. Trigonometric Functions",
        "4. Principle of Mathematical Induction",
        "5. Complex Numbers and Quadratic Equations",
        "6. Linear Inequalities",
        "7. Permutations and Combinations",
        "8. Binomial Theorem",
        "9. Sequences and Series",
        "10. Straight Lines",
        "11. Conic Sections",
        "12. Introduction to Three Dimensional Geometry",
        "13. Limits and Derivatives",
        "14. Statistics",
        "15. Probability"
    ];

    let chapters12 = [
        "1. Relations and Functions",
        "2. Inverse Trigonometric Functions",
        "3. Matrices",
        "4. Determinants",
        "5. Continuity and Differentiability",
        "6. Applications of Derivatives",
        "7. Integrals",
        "8. Applications of Integrals",
        "9. Differential Equations",
        "10. Vector Algebra",
        "11. Three Dimensional Geometry",
        "12. Linear Programming",
        "13. Probability"
    ];

    let chapters =
        selectedClass == 11 ? chapters11 : chapters12;

    document.getElementById("chapterTitle").innerText =
        "📚 Class " + selectedClass + " • " +
        selectedBoard + " Chapters";

    chapters.forEach(function(chapter){

        let button = document.createElement("button");

        button.className = "chapter";

        button.innerText = chapter;

        button.onclick = function(){
            alert(
                chapter +
                "\\n\\nContent will be added next."
            );
        };

        list.appendChild(button);
    });

    document.getElementById("chapterPage").classList.remove("hidden");
}


function goBack(page){

    hideAll();

    document.getElementById(page).classList.remove("hidden");
}

</script>

</body>
</html>
